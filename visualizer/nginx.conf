server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Aggressive caching for hashed static assets (JS, CSS bundles)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: all routes return index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access logs for static assets to reduce noise
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
